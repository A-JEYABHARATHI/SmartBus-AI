spring.application.name=smartbus-backend

# Example MySQL configuration for local development.
# Copy this file to application.properties locally and replace the placeholder values.
spring.datasource.url=jdbc:mysql://localhost:3306/smartbus_ai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=smartbus_user
spring.datasource.password=your_local_mysql_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
